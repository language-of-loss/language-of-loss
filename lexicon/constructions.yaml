    patterns:
      - entry_id: KIN-HI
        lang: hi
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:माँ|मम्मी|माता|माताजी|अम्मा|अम्मी|पापा|पिता|पिताजी|बाबूजी|बाबा|अब्बू|अब्बा|दादी|दादा|दादाजी|नानी|नाना|नानाजी|भाई|भैया|भाईसाहब|बहन|दीदी|बेटा|बेटी|पति|पत्नी|चाचा|चाची|मामा|मामी|बुआ|मौसी|ताऊ|ताई|दोस्त|सहेली)(?:जी)?(?![ऀ-ॣ०-९ॱ-ॿ‌‍])"
      - entry_id: KIN-EN
        lang: en
        regex: "(?<![A-Za-z'])(?:mother|mom|mum|mummy|ma|maa|amma|ammi|father|dad|daddy|papa|appa|abbu|grandmother|grandma|dadi|nani|grandfather|grandpa|dada|nana|brother|bhai|bhaiya|sister|didi|son|daughter|husband|wife|uncle|aunt|aunty|chacha|chachi|mama|mami|bua|mausi|friend|best\\s+friend)(?:s|'s)?(?![A-Za-z])"

  - id: F10
    name: plural_self_reference
    components: [WITH_OTHERS, KIN]
    grammar_forced: "N"
    sub_flag: ""
    eligibility_rule: "chosen (singular alternative available); NB Hindi हम can be singular in eastern varieties: code via the codebook, not the flag"
    source: "research plan §5.1"
    patterns:
      - entry_id: P-EN-71
        lang: en
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:we\\s+lost|our\\s+(?:loss|mother|father|mom|mum|dad|papa|amma|grandmother|grandfather|nani|nana|dadi|dada|brother|sister))(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
      - entry_id: P-HI-31
        lang: hi
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:अपन(?:े|ों)(?:\\s+(?:का|के|को|से))?)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
      - entry_id: P-HI-32
        lang: hi
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:परिवार|घर\\s+वाल[ेों]|कुटुंब|ख़?ानदान)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"

  - id: F11
    name: direct_death_reference
    components: [NOT_HERE]
    grammar_forced: "N"
    sub_flag: "names_direct"
    eligibility_rule: "control flag: denominator for the indirect share"
    source: "new"
    patterns:
      - entry_id: P-HI-60
        lang: hi
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:मर\\s+ग(?:ए|ये|यी|ईं|ई|या)|मृत्यु\\s+हो\\s+ग[ऀ-ॿ]*|मौत\\s+हो\\s+ग[ऀ-ॿ]*)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
      - entry_id: P-EN-60
        lang: en
        regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:die(?:d|s)?|dying|death)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"

  - id: F12
    name: names_emotion
    components: []
    grammar_forced: "N"
    sub_flag: ""
    eligibility_rule: "used by H4 naming vs narrating"
    source: "recommendation N1 (NAME-EMOTION moved out of the vector)"
    patterns: []

matcher_rules:
  - id: R1
    rule: "A clause vector is the elementwise OR of matched entry vectors and flag vectors (Plan v3 N1 step 3)."
  - id: R2
    rule: "Components tagged (grammar) on a construction (HAPPEN_TO from F1, KIN from F2) are written to a separate grammar_forced vector and are not counted as chosen orientation evidence."
  - id: R3
    rule: "Negation flips duty: सेवा / देखभाल / care with a negated opportunity (अवसर नहीं, नहीं कर पाया, never got to, couldn't) scores DUTY_UNDONE instead of DUTY_DONE; 'never got to say goodbye' scores DUTY_UNDONE."
  - id: R4
    rule: "Exclusions for prime-form polysemy: pronoun + लोग (हम लोग, आप लोग) is not PEOPLE; 'के पास' possessive is not NEAR; deontic चाहिए is not WANT; N + करना conjunct verbs are not DO; शायद ही is not MAYBE."
  - id: R5
    rule: "Bare 'passed', bare 'gone' and मरना in hyperbole (शर्म से मर गई) are matched but routed to human review (review_queue = Y) before counting."
  - id: R6
    rule: "names_emotion (F12) is set when the clause matches a lexicon row with pos beginning 'noun' and FEEL_BAD in its vector; it is a form flag outside the K vector."
  - id: R7
    rule: "The indirect_death_reference share = clauses matching F3/F4/F5/F16-type euphemisms over (those + F11 direct forms), per language."
  - id: R8
    rule: "Honorific plural (F2): the pattern matches pronoun forms only; singular reference must be confirmed from the Stanza parse (P7) or by the coder before KIN + respect is scored."

stage4_flags:
  - id: S4-01
    column: dative_regex
    extends: F1
    lang: hi
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:मुझे|मुझको|हमें|हमको|उन्हें|उनको|उसे|उसको|आपको|तुम्हें|तुमको|तुझे|तुझको|इन्हें|इनको|इसे|इसको)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])[^।\\n]*?(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:हुआ|हुई|हुए|होता|होती|लगता|लगती|लगा|लगी|आता|आती|आते|आया|आई|आयी|रहा|रही|रहे)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: "finite_dative"
    note: "dative pronoun followed later in the clause by an experiencer verb form; the form must be a clause head or its aux/cop/compound and must not directly follow a -ते/-कर/-ए verb (देखते हुए is a converb, not a predicate)"
  - id: S4-03
    column: motion_euphemism
    extends: F3
    lang: hi
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:(?<!ता\\s)(?<!ते\\s)(?<!ती\\s)चल[ेी]\\s+ग(?:ए|ये|ईं|यीं)|गुज़?र\\s+ग(?:ए|ये|ईं|यीं)|छोड़?\\s+ग(?:ए|ये|ईं|यीं))(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: "no_destination"
    note: "honorific-plural motion verbs: चले गए / चली गईं / गुज़र गए / छोड़ गए (+ गये/गयीं spellings); not after a -ता/-ते/-ती participle (बदलती चली गईं = aspectual 'kept changing'); चले/चली गए with a destination (बाज़ार चले गए, घर को, बाहर) is literal motion and is not counted"
  - id: S4-04
    column: closing_formula
    extends: F6
    lang: hi
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:आत्मा\\s+को\\s+शा(?:ं|ँ|न्)ति|(?:ॐ|ओम्?)\\s*शा(?:ं|ँ|न्)ति|श्रद्धा(?:ं|ँ)जलि|नमन)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: ""
    note: "आत्मा को शांति / ॐ शांति / श्रद्धांजलि / नमन"
  - id: S4-05
    column: motion_euphemism
    extends: F3
    lang: en
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?i:pass(?:ed|es|ing)\\s+away|pass(?:ed|es|ing)\\s+on(?!\\s+(?:the|a|an|his|her|my|our|their|this|that|it|to|these|those)(?![A-Za-z]))|left\\s+us(?!\\s+(?:a|an|the|some|any|no|his|her|my|our|their|with|alone)(?![A-Za-z])))(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: ""
    note: "passed away / passed on (not + object) / left us (not + object or 'alone')"
  - id: S4-05b
    column: motion_euphemism
    extends: F3
    lang: en
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?i:(?:is|was|are|were|be|been|[A-Za-z]+['’]s)\\s+gone|gone\\s+(?:too\\s+soon|forever))(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: "animate_subject"
    note: "is gone / gone too soon|forever, only with a person subject (not 'the pain is gone')"
  - id: S4-06
    column: no_more
    extends: F5
    lang: en
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?i:(?:is|was|are|were)\\s+no\\s+more)(?!\\s+(?:than|[A-Za-z]+ing)(?![A-Za-z]))(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: ""
    note: "is/was no more (English counterpart of नहीं रहे); not 'no more than' or 'no more + -ing noun'"
  - id: S4-07
    column: closing_formula
    extends: F6
    lang: en
    regex: "(?<![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])(?:(?i:rest\\s+in\\s+peace|may\\s+(?:her|his|their|your)\\s+soul)|RIP|R\\.I\\.P\\.?)(?![ऀ-ॣ०-९ॱ-ॿ‌‍A-Za-z0-9_'])"
    filter: ""
    note: "rest in peace / RIP (upper case only) / may her|his soul"

