project:
  name: grief-hi-en-corpus
  languages: [en, hi]
  population_default: unknown

targets:
  seed_corpus:
    total: 15
    per_language: {en: 8, hi: 7}
    role: codebook_development
  twitter_x:
    eligible_total: 20000
    eligible_per_language: {en: 10000, hi: 10000}
    track_raw_separately: true
  youtube:
    pilot_comments: 200
    pilot_min_videos: 8
    pilot_min_channels: 5
    scale_requires: [access_confirmed, permitted_use_confirmed, comparability_confirmed]
  long_form:
    documents_total: 52
    documents_per_language: {en: 26, hi: 26}
    min_usable_words_per_language: 30000
  annotation_queue:
    max_texts: 400
    balance: language
    stratify_by: source
    exclude: [seed_corpus]

discovery:
  per_query_limit: 25
  request_timeout_s: 30
  min_delay_s: 1.0
  github_search_delay_s: 7.0
  max_retries: 3
  platforms: [huggingface, zenodo, github, osf, dataverse, datacite, openalex]
  queries:
    en:
      - bereavement
      - grief
      - grief narratives
      - mourning
      - personal loss death
      - condolence
      - bereavement tweets
      - grief support forum
      - obituary corpus
      - continuing bonds
      - grief Hindi
      - bereavement India
      - Hindi English code-mixed emotion
      - Hindi emotion dataset
    hi:
      - शोक
      - दुख मृत्यु
      - श्रद्धांजलि
      - शोक संदेश
      - निधन
      - मातम
      - हिंदी भावना डेटासेट
      - शोक कथा

  platform_queries:
    huggingface:
      - {search: grief}
      - {search: griev}
      - {search: bereav}
      - {search: mourn}
      - {search: condolence}
      - {search: obituar}
      - {search: funeral}
      - {search: eulogy}
      - {search: memorial}
      - {search: hinglish}
      - {search: code-mixed}
      - {search: codemixed}
      - {search: emotion, filter: "language:hi"}
      - {search: sentiment, filter: "language:hi"}
      - {search: tweet, filter: "language:hi"}
      - {search: comment, filter: "language:hi"}
      - {search: reddit, filter: "language:hi"}
      - {search: youtube, filter: "language:hi"}
      - {search: mental, filter: "language:hi"}
      - {search: stories, filter: "language:hi"}
      - {search: blog, filter: "language:hi"}

  stage3:
    platforms: [zenodo, github, osf, dataverse, datacite]
    queries:
      en:
        - GriefSupport reddit
        - reddit bereavement posts
        - grief reddit dataset
        - loss of a parent narratives
        - RIP tweets dataset
        - condolence tweets
        - covid india tweets hindi
        - youtube comments hindi dataset
        - hindi blog corpus
        - death anniversary posts
        - memorial posts social media
        - widowhood narratives India
      hi-Latn:
        - shradhanjali
        - shok sandesh
        - hinglish youtube comments
        - hinglish tweets dataset
        - romanized hindi corpus
      hi:
        - पुण्यतिथि
        - संस्मरण पिता
        - हिंदी ब्लॉग कॉर्पस
        - हिंदी ट्वीट डेटासेट
    platform_queries:
      huggingface:
        - {search: GriefSupport}
        - {search: reddit-grief}
        - {search: grief_}
        - {search: bereavement}
        - {search: loss-of}
        - {search: widow}
        - {search: rip_}
        - {search: tribute}
        - {search: reddit, filter: "language:en", note: "too broad - first 25 only"}
        - {search: india-reddit}
        - {search: indian_reddit}
        - {search: r_india}
        - {search: youtube-comments}
        - {search: youtube_comments}
        - {search: hindi-tweets}
        - {search: hindi_tweets}
        - {search: hindi-blog}
        - {search: romanized}
        - {search: roman-hindi}
        - {search: mental-health, filter: "language:hi"}
        - {search: counsel, filter: "language:hi"}

triage:
  grief_terms: [grief, griev, bereave, mourning, mourn, condolence, obituar, funeral,
                "loss of a loved", "continuing bonds", widow, "शोक", "श्रद्धांजलि",
                "निधन", "मातम", "मृत्यु", "दुख"]
  hindi_terms: [hindi, hinglish, "code-mixed", "code mixed", devanagari, indic, india,
                "हिंदी", "हिन्दी"]
  synthetic_terms: [synthetic, "llm-generated", "gpt-generated", "generated by", "chatgpt",
                    "gpt-4", "gpt-3", "artificially generated", augmented]
